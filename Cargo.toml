[package]
name = "bookshelf"
version = "0.1.0"
edition = "2024"
description = "Paper / Folia server plugin manager (Modrinth, Hangar, Spigot)"
repository = "https://github.com/kuripasanda/bookshelf"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
comfy-table = "8.0.1"
dialoguer = "0.12.0"
futures-util = "0.3.34"
hex = "0.4.3"
indicatif = "0.18.6"
owo-colors = "4.4.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
sha1 = "0.11.0"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
urlencoding = "2.1.3"
zip = "9.1.1"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
